#config_version=6

# Hardware the ROM switch table does not list (SAM dedicated switches), and the ball devices.
# Dedicated switches use SAM's own numbering: "D<n>" is dedicated switch #n (1-24) of the SAM CPU board
# (PinMAME src/wpc/sam.c, "Dedicated Switches"; the rules docs call the slam tilt D-18). The P-ROC config
# overlay (hw_proc.yaml) turns D<n> into libpinproc's "SD<n>" (scripts/gen_config.py); docs/hardware.md has the list.

switches:
  s_left_flipper:     # DED #9 left flipper button (EOS #10 is in hw_proc.yaml)
    number: D9
  s_right_flipper:    # DED #11 right flipper button (EOS #12)
    number: D11
  s_plumb_bob_tilt:   # DED #17 tilt (plumb bob)
    number: D17
  s_slam_tilt:        # DED #18 slam tilt
    number: D18
  s_coin:             # DED #3 right coin slot (the slot tron/credits.py uses)
    number: D3
  s_start_button:     # number comes from the asset package (matrix switch 16)
    tags: start
  # Coin door buttons, DED #21-24 in the order of PinMAME's SAM input port (Back, Minus, Plus, Select).
  # They drive the service menu (tron/service.py); the tags are MPF's service-button tags.
  s_service_back:
    number: D21
    tags: service_esc
  s_service_minus:
    number: D22
    tags: service_down
  s_service_plus:
    number: D23
    tags: service_up
  s_service_select:
    number: D24
    tags: service_enter
  # Active while the coin door is open (ROM 0x3727c bits clear): adj 41, adj 64. SAM reads the door through
  # the IO board's interlock status bits, not a switch input; DED #20 is SAM's spare dedicated input, so
  # a P-ROC machine needs a door switch wired there (docs/hardware.md).
  s_coin_door_open:
    number: D20

playfields:
  playfield:
    default_source_device: bd_shooter_lane
    tags: default

ball_devices:
  bd_trough:
    ball_switches: s_trough_1_r, s_trough_2, s_trough_3, s_trough_4_l
    jam_switch: s_trough_jam
    eject_coil: c_trough_up_kicker
    eject_targets: bd_shooter_lane
    tags: trough, home, drain
    entrance_count_delay: 530ms   # ROM: drain to drain handling 0.53-0.54 s (game_flow, game_flow_tilt)
    debug: false
  bd_shooter_lane:
    ball_switches: s_shooter_lane
    eject_coil: c_auto_launch
    mechanical_eject: true
    eject_timeouts: 1s
  bd_vuk:
    ball_switches: s_video_game_eject
    eject_coil: c_video_game_eject
    eject_timeouts: 2s

ball_holds:
  hold_vuk:                 # the VUK keeps its ball until the rules release it (switches.vuk_kickout)
    hold_devices: bd_vuk
    balls_to_hold: 1
    enable_events: game_started
    disable_events: game_ended
    release_one_events: tron_vuk_release
