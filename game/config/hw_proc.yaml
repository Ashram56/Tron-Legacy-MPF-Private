#config_version=6

# Hardware overlay for the real machine, Tron Legacy Pro (the default): a Multimorphic P-ROC in place of the SAM CPU
# board, driving the original Stern SAM IO board.
#   cd game && ../.venv/bin/mpf game . -c config,hw_proc   (or: python scripts/run.py --hw proc)
# It is the LE overlay (hw_proc_le.yaml) with the Pro's IO assignments: machine_pro.yaml (the Pro's SAM numbers,
# from assets/io/pro_vs_le_io_map.csv), then their P-ROC numbers (rom/proc_numbers_pro.yaml, generated by
# scripts/gen_config.py). Each included file wins over the ones before it. docs/hardware.md, "Pro or LE".

config:
  - hw_proc_le.yaml
  - machine_pro.yaml
  - rom/proc_numbers_pro.yaml
