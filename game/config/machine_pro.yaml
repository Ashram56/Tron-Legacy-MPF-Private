#config_version=6

# Tron Legacy Pro: the Pro 1.74 ROM's IO assignments over the LE numbers of config.yaml (rom/pro_numbers.yaml,
# generated by scripts/gen_config.py from assets/io/pro_vs_le_io_map.csv and assets/docs/PRO_VS_LE.md):
# - switches 1-4 are the T-R-O-N standups in reverse order (sw 1 = N); no Recognizer position switches 54-56
# - coil 3 is the disc direction relay (22 on the LE); no drop target reset, no Recognizer motor relay; the ramp
#   flashers stay on 19 and 25 (the Pro ROM names them BACK CENTER / BACK LEFT); the Pro's own flashers 22 LOWER
#   LEFT, 23 LOWER RIGHT fire with them (assets/rom_data/pro/README.md, tron/hw_numbers.py)
# - lamps 1-66 renumbered; no Recognizer position lamps
# LE devices the Pro does not have stay defined (the rules still address them) on the virtual platform.
# Included by the Pro overlays (hw_proc, hw_virtual, hw_vpx_pro). docs/hardware.md, "Pro or LE".

config:
  - rom/pro_numbers.yaml

machine_vars:
  machine_variant:
    initial_value: pro
    value_type: str
    persist: false
  # The ramp light tubes (fiber optics) are an LE feature, but the Pro's IO board has the aux bus driver and nothing
  # else is wired to it, so they stay defined: off unless enabled (-c ...,fiber_optics, fiber_optics.yaml).
  fiber_optics:
    initial_value: 0
    value_type: int
    persist: false
