#config_version=6

# Stern Tron Legacy LE v1.74, MPF machine config.
# Switch, coil and light numbers are the original SAM numbers from the asset package: the LE's, which the ROM
# traces use. This file is platform neutral: a hardware overlay is picked at launch (docs/hardware.md). Each
# overlay exists for both machines, the Pro (the default) and the LE:
#   mpf game . -c config,hw_virtual   smart_virtual platform (balls move, trough starts full), MPF Monitor
#   mpf game . -c config,hw_proc      the real machine: P-ROC on the Stern SAM IO board
#   mpf game . -c config,hw_proc_le   the same on an LE (hw_virtual_le likewise; hw_vpx is the LE table)
# The unit tests and tests/scenario.py load this file alone and force smart_virtual themselves.
# The rules themselves run in Python (game/tron/), see tron/os_layer.py.

config:
  - rom/switches.yaml
  - rom/coils.yaml
  - rom/coil_times.yaml   # the ROM's coil drive times (pulse, hold, pulse power)
  - rom/lights.yaml
  - rom/settings.yaml   # the 88 operator adjustments as MPF settings (persisted machine vars)
  - hardware.yaml
  - pup.yaml            # PuP Pack (docs/pup/README.md)

modes:
  - attract
  - game
  - tron_service       # the ROM's service menu (tron/service.py), coin-door buttons

custom_code: tron.os_layer.TronOS

game:
  balls_per_game: machine.balls_per_game   # adj 31 BALLS PER GAME (tron/settings.py keeps the var set)
  max_players: 4

mpf:
  paths:
    tron_audits: data/tron_audits.yaml    # the ROM's audit counters (tron/settings.py)
    tron_credits: data/tron_credits.yaml  # credits and the pricing unit counter (tron/credits.py)
    tron_high_scores: data/tron_high_scores.yaml  # high-score table (tron/features/high_scores.py)

machine:
  balls_installed: 4
  min_balls: 1
