#config_version=6

# Hardware overlay for the real machine, Tron Legacy LE: a Multimorphic P-ROC in place of the SAM CPU board,
# driving the original Stern SAM IO (driver/lamp) board. Picked at launch on top of the platform-neutral config.yaml:
#   cd game && ../.venv/bin/mpf game . -c config,hw_proc_le   (or: python scripts/run.py --hw proc --machine le)
# hw_proc.yaml is the Pro (the default): this file plus the Pro's numbers. hw_virtual*.yaml are the overlays for
# MPF Monitor and the desktop.
# Numbers: rom/proc_numbers.yaml, included below (generated by scripts/gen_config.py; an included file's
# keys win over this file's, and the two never set the same key). Wiring, what changes from the original machine
# and the bring-up order: docs/hardware.md. Coil drive times are the ROM's (rom/coil_times.yaml, from config.yaml);
# check every coil at low power first all the same (docs/hardware.md, "First power-up").

config:
  - rom/proc_numbers.yaml
  - machine_le.yaml

hardware:
  platform: p_roc, virtual     # P-ROC is the default; virtual carries the aux bus outputs (tubes, ticket outputs)
  # Here, not under p_roc: (MPF validates p_roc: driverboards as an enum and lowercases it to "sternsam", which
  # pypinproc's normalize_machine_type does not know: it compares with strcmp and returns an invalid type).
  driverboards: sternSAM

custom_code: tron.os_layer.TronOS, tron.proc_hardware.ProcHardware

# tron/proc_hardware.py: the two ramp light tubes (fiber optics) on the IO board's aux bus, written through the
# P-ROC aux port. 0 (off) until the bus writes have been checked with a logic analyzer (docs/hardware.md, "Ramp
# light tubes"); 1 turns them on. The machine var fiber_optics (machine_le.yaml / machine_pro.yaml) must be 1 too.
machine_vars:
  proc_ramp_tubes:
    initial_value: 0
    value_type: int
    persist: false

switches:
  # SAM dedicated switches the ROM's switch table does not list. libpinproc "SD<n>" = SAM dedicated #n.
  s_left_flipper_eos:
    number: SD10
  s_right_flipper_eos:
    number: SD12
  s_upper_left_flipper_eos:
    number: SD14
  # The asset package tags slings and pops playfield_active; with autofire_coils (below) MPF does that itself
  # and refuses the tag.
  s_left_slingshot:
    tags: ""
  s_right_slingshot:
    tags: ""
  s_left_bumper:
    tags: ""
  s_right_bumper:
    tags: ""
  s_bottom_bumper:
    tags: ""

coils:
  # Pulse and hold times: the ROM's (rom/coil_times.yaml). Only what the P-ROC needs on top of them here.
  c_orbit_up_down_post:        # the ROM holds the post about 2 s after a plunge (1 ms on / 6 ms off); never longer than 4 s
    max_hold_duration: 4s

# The SAM CPU fires flippers, slingshots and pop bumpers itself; on the P-ROC they are hardware rules. The rules
# code also switches the flippers off at tilt, slam tilt and ball end and back on for the next ball
# (tron/os_layer.py); the events below cover the rest (game over, high-score entry, service menu).
flippers:
  left_flipper:
    main_coil: c_left_flipper
    activation_switch: s_left_flipper
    eos_switch: s_left_flipper_eos
    disable_events: ball_will_end, game_ending, game_ended, service_mode_entered, tron_service_entered
  right_flipper:
    main_coil: c_right_flipper
    activation_switch: s_right_flipper
    eos_switch: s_right_flipper_eos
    disable_events: ball_will_end, game_ending, game_ended, service_mode_entered, tron_service_entered
  upper_left_flipper:          # on the left button, like the original
    main_coil: c_upper_left_flipper
    activation_switch: s_left_flipper
    eos_switch: s_upper_left_flipper_eos
    disable_events: ball_will_end, game_ending, game_ended, service_mode_entered, tron_service_entered

autofire_coils:
  left_slingshot:
    coil: c_left_slingshot
    switch: s_left_slingshot
    disable_events: ball_will_end, game_ended, service_mode_entered, tron_service_entered, tron_tilt
  right_slingshot:
    coil: c_right_slingshot
    switch: s_right_slingshot
    disable_events: ball_will_end, game_ended, service_mode_entered, tron_service_entered, tron_tilt
  left_bumper:
    coil: c_left_bumper
    switch: s_left_bumper
    disable_events: ball_will_end, game_ended, service_mode_entered, tron_service_entered, tron_tilt
  right_bumper:
    coil: c_right_bumper
    switch: s_right_bumper
    disable_events: ball_will_end, game_ended, service_mode_entered, tron_service_entered, tron_tilt
  bottom_bumper:
    coil: c_bottom_bumper
    switch: s_bottom_bumper
    disable_events: ball_will_end, game_ended, service_mode_entered, tron_service_entered, tron_tilt

# The original 128x32 DMD on the P-ROC's DMD connector. Godot (GMC) still draws it: started with
# "-- --proc-dmd", game/tools/proc_dmd.gd sends each frame to MPF as a 16-shade "dmd_frame" (docs/hardware.md).
dmds:
  dmd:
    platform: p_roc
