; PuP Pack (Tron Legacy "End of Line" PuP-Pack by Terry Red, pup_pack/ submodule) on three screens.
; Read by Godot (game/pup/pup_player.gd) and by MPF (game/tron_pup/settings.py).
;
; Do not edit this file for your cabinet: put the keys you change in game/pup.local.cfg (git-ignored,
; same sections), it is read after this one. TRON_PUP=0 in the environment turns the whole PuP off.
; Values are JSON: true/false, numbers, "strings", [lists].

[pup]

; false: no PuP windows, no PuP videos, the ROM music plays as before
enabled=true
; the optional third screen (topper videos, PuP screens 13 and 14); false = no window, no topper videos
third_screen=true
; PuP OST music (PuP screen 15) instead of the ROM music. false keeps the ROM music, still plays the videos
ost_music=true
; who plays the pack's videos where both are installed (Windows): "gozen" (FFmpeg, GPU decoding through
; Direct3D 11 Video, the same player as Linux) or "native" (the native_video add-on, Media Foundation).
; TRON_VIDEO_PLAYER=gozen|native in the environment overrides it for one run
video_player="gozen"
; the PuP Pack folder (relative to the repository root) and the converted media (scripts/pup/gen_pup.py)
pack_dir="pup_pack/trn_174h"
media_dir="pup_media/trn_174h"
; seconds between two "TRON logo in attract" (D1) triggers while attract runs; trigger 5 itself rests 240 s
attract_cycle_seconds=60.0
; volumes in percent, applied on top of the PuP Pack's own playlist/trigger volumes
video_volume=100
music_volume=100
; "stack": backglass, DMD, topper one under the other at the left of the backglass's monitor, as large as
; its height allows (each keeps the shape of its size below; position is ignored). "manual": every window
; at its own screen/position/size below (a cabinet: set this in pup.local.cfg)
layout="stack"

; Every window: screen = monitor index (0 = primary), position/size in pixels on that monitor,
; fullscreen = cover the whole monitor (position/size ignored), borderless = no title bar.
; Every window can be resized; its content follows. run.py --dmd-size WxH sets the DMD window's size.

; Screen 1: the backglass (4:3). PuP screens 2 (underlay: background and mode loops) and 12 (top layer: event
; videos). The videos are 16:9: fit = whole video with black bars, fill = cover the screen (crops the sides),
; stretch = distort to the screen.
[backglass]

; false: no backglass window (a DMD-only screen); its videos are not played
enabled=true
screen=0
position=[0, 0]
size=[800, 600]
fullscreen=false
borderless=false
fit="fit"
; vertical alignment of a fitted 16:9 video on a 4:3 screen: 0 = top, 0.5 = centre, 1 = bottom
align=0.5

; Screen 2: the large LCD DMD, with the game's own 128x32 DMD in its middle.
; background="lightcycles": the DMD in a neon frame over a live 3D chase of two light cycles (their trails fade,
; they derez when they hit one); lightcycles_dmd = the DMD's width as a share of the window's, at most
; lightcycles_dmd_height of its height (0.68 and 0.62: the DMD's share of the pack's own DMD panel art). background="frame": the DMD in the PuP Pack's DMD panel art (the bottom of its 4:3 backbox art);
; frame_crop = [x, y, w, h] in pixels of frame_image; dmd_rect = [x, y, w, h] of the DMD in the same pixels
; (fitted inside, 4:1); frame_image="" draws no frame: the DMD then fills dmd_rect of a black window.
[dmd]

screen=0
position=[0, 620]
size=[960, 238]
fullscreen=false
borderless=false
background="lightcycles"
lightcycles_dmd=0.68
lightcycles_dmd_height=0.62
frame_image="PuPAlphas/Tron Backbox 4x3 or 5x4.png"
frame_crop=[0, 1060, 1920, 476]
dmd_rect=[300, 1172, 1320, 292]
; round dots like a real DMD (false: square pixels); classic DMD only, HD has its own (run.py --dmd-dots)
dots=true
; minimise the game's own 128x32 window (it stays the source of the DMD picture)
hide_main_window=true

; Screen 3 (optional, [pup] third_screen): the topper, PuP screens 13 (underlay) and 14 (top layer).
[topper]

screen=0
position=[820, 0]
size=[960, 281]
fullscreen=false
borderless=false
fit="fill"
align=0.5
