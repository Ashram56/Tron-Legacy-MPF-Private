# W<n>: PinMAME switch n = the SAM switch number (game/config/rom/switches.yaml). Names, not numbers: the
# P-ROC overlay renumbers the switches.
switches:
  1: s_tron_t
  2: s_tron_r
  3: s_tron_o
  4: s_tron_n
  7: s_zuse_z
  8: s_zuse_u
  11: s_video_game_eject
  13: s_zuse_e
  23: s_shooter_lane
  48: s_zuse_s

# Whole trigger rows replaced by MPF events (triggers.pup ID -> events).
override:
  # "Arcade Mystery" W11=1,L35=1: the VUK while Flynn's Arcade is lit. PinMAME's lamp 35 is not the SAM lamp
  # 35, and the game says it directly: deff 105 is the Flynn's Arcade award.
  23: [tron_deff_105]
