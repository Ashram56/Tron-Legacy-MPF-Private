  85: [tron_deff_48, tron_deff_49]
  86: [tron_deff_48, tron_deff_49]
  87: [tron_deff_48, tron_deff_49]
  88: [tron_deff_119]                     # sea of simulation stage 4 (weak match: 53 %)
  89: [tron_deff_52]                      # disc multiball restart
