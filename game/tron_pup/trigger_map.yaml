# What the PuP Pack's trigger codes mean in this MPF game (read by game/tron_pup/engine.py).
#
# In Visual Pinball, PinUP Player watches PinMAME's DMD: D<n> fires when the pixels inside the purple
# rectangle of PupCapture/<n>.bmp appear on the DMD. Here the rules tell us instead: the game posts
# tron_deff_<id> when display effect <id> takes the DMD (game/tron/display.py), so each D<n> is mapped to the
# display effect(s) whose frames contain that capture. scripts/pup_captures.py did the matching (every frame
# of every effect, its variants and the ROM's library animations, against the 98 captures) and writes the
# report to docs/pup_captures.md; re-run it when the upstream DMD animations change.
#
# An event may carry a condition on its arguments: tron_deff_112{award==1}.
# Synthetic events posted by game/tron_pup/mode.py:
#   pup_boot          PuP player ready (D0=1, PinUP Player's start-up trigger)
#   pup_power_up      first attract after power-up (D54: the boot screen "TRON L.E. V1.74")
#   pup_attract_cycle every [pup] attract_cycle_seconds while attract runs (D1: TRON logo in the attract loop)

dmd:
  0: [pup_boot]
  1: [tron_deff_1, pup_attract_cycle]     # TRON LEGACY logo of the attract loop (library anim 5)
  2: ["player_added{num==1}"]             # "00" in player 1's score line: game started
  3: [tron_deff_136]                      # find Flynn intro
  4: [tron_deff_137]                      # Flynn found
  5: [tron_deff_38]                       # MATCH
  6: [tron_deff_1]                        # attract score display
  7: [tron_deff_101, tron_deff_102, tron_deff_103]   # skill shot (all three share the frame)
  8: [tron_deff_132]                      # extra ball lit
  9: [tron_deff_133]                      # extra ball
  10: [tron_deff_26]                      # shoot again
  11: [tron_deff_108]                     # recognizer / disc access progress (also drawn by 130 at game over)
  12: [tron_deff_71]                      # CLU intro
  13: [tron_deff_74]                      # CLU total
  14: [tron_deff_25]                      # BONUS (end of ball: drain)
  15: [tron_deff_25]                      # bonus, second page
  16: [tron_deff_75]                      # gem progress
  17: [tron_deff_76]                      # gem intro
  18: [tron_deff_78]                      # gem award (jackpot)
  19: [tron_deff_79]                      # gem total (the same TOTAL frame is in zuse total, 99)
  20: ["tron_deff_112{award==2}"]         # SUPER POPS
  21: ["tron_deff_112{award==1}"]         # DOUBLE SCORING
  22: ["tron_deff_112{award==4}"]         # SUPER SPINNERS
  23: [tron_deff_55]                      # Daft Punk letters: "1 MORE TO LIGHT EX BALL"
  24: [tron_deff_55]                      # Daft Punk letters: "1 MORE TO LIGHT MULTIBALL"
  25: [tron_deff_55]                      # DAFT PUNK MULTIBALL IS LIT
  26: [tron_deff_56]                      # end of line multiball intro
  27: [tron_deff_61]                      # end of line total
  28: [tron_deff_84]                      # light cycle multiball lit
  29: [tron_deff_85]                      # light cycle multiball intro
  30: [tron_deff_90]                      # light cycle total
  31: [tron_deff_87, tron_deff_88]        # light cycle jackpot (and super jackpot, same frame)
  32: [tron_deff_83]                      # light cycle progress
  33: [tron_deff_113]                     # sea of simulation intro
  34: [tron_deff_126]                     # sea of simulation total
  35: [tron_deff_62]                      # quorra progress
