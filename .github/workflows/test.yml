name: test

# Only pushes to main (and a manual run from the Actions tab): other branches and pull requests are
# tested locally.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        # assets/ only (scripts/setup.py fetches it): the PuP Pack submodule is a private repo the workflow
        # token cannot read, and tests/test_pup.py skips its pack tests without it

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/toolchain.py      # the pinned versions live there

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain.py') }}

      - name: Setup (venv, MPF, Godot, GMC, generated media, Godot import)
        run: python scripts/setup.py

      - name: Unit tests
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }} -m pytest -q tests

      - name: Render check (Godot + MPF on Xvfb, DMD capture)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 libglx-mesa0 > /dev/null
          python scripts/render_check.py 15

      - name: Keep the captures and logs
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: render-check
          path: |
            captures/dmd_latest_x8.png
            captures/godot.log
            captures/mpf.log
          if-no-files-found: ignore
